name: Hedwig Report

# Scheduled nightly at 9pm IST = 15:30 UTC, plus workflow_dispatch so you
# can manually trigger a run from the Actions tab (same as Hedwig Collect)
# for testing, without waiting for the schedule.
on:
  schedule:
    - cron: "30 15 * * *"  # 15:30 UTC = 21:00 IST
  workflow_dispatch:

# Least-privilege: only repo-contents write is ever needed here.
permissions:
  contents: write

# Only one report generation at a time -- if you manually trigger a run
# while the nightly scheduled one happens to be running, this waits its
# turn rather than running both simultaneously and colliding.
concurrency:
  group: hedwig-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung step can't silently run for hours.
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Pinned exact versions -- secrets are exposed as env vars in
        # this job, so installs here should never silently pull in a
        # newer, unreviewed release.
        #
        # httpx is pinned explicitly here too, not just openai -- without
        # this, pip installs the newest httpx (0.28+), which removed a
        # parameter that openai==1.54.4 still passes internally when
        # creating its client. That mismatch is what caused:
        #   "Client.__init__() got an unexpected keyword argument 'proxies'"
        # httpx<0.28 is the last line of releases before that removal.
        run: pip install requests==2.32.3 openai==1.54.4 "httpx==0.27.2" reportlab==4.2.5

      - name: Collect fresh data first
        # Runs a collection pass right before reporting, so the nightly
        # report reflects whatever's newest rather than only what the
        # last scheduled hedwig-collect.yml run happened to catch.
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python hedwig_collector.py

      - name: Generate the report
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python hedwig_reporter.py

      - name: Commit and push the new report
        run: |
          git config user.name "Hedwig Bot"
          git config user.email "hedwig-bot@users.noreply.github.com"
          git add reports/ data/
          git diff --staged --quiet || git commit -m "Hedwig: report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
