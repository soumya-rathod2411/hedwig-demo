name: Hedwig Report

# Scheduled nightly at 9pm IST = 15:30 UTC. No workflow_dispatch anymore --
# the on-demand "Generate Report Now" button was dropped, so this workflow
# now only ever runs on its own schedule, never triggered manually.
on:
  schedule:
    - cron: "30 15 * * *"  # 15:30 UTC = 21:00 IST

# Least-privilege: only repo-contents write is ever needed here.
permissions:
  contents: write

# Kept even with a single trigger now -- harmless safety net in case the
# schedule ever somehow double-fires (GitHub Actions has been known to
# occasionally do this around DST-adjacent dates), so two report runs
# still can't collide and corrupt the same files.
concurrency:
  group: hedwig-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung step can't silently run for hours.
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Pinned exact versions -- same reasoning as hedwig-collect.yml:
        # secrets are exposed as env vars in this job, so installs here
        # should never silently pull in a newer, unreviewed release.
        run: pip install requests==2.32.3 openai==1.54.4 reportlab==4.2.5

      - name: Collect fresh data first
        # Runs a collection pass right before reporting, so the nightly
        # report reflects whatever's newest rather than only what the
        # last scheduled hedwig-collect.yml run happened to catch.
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python hedwig_collector.py

      - name: Generate the report
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python hedwig_reporter.py

      - name: Commit and push the new report
        run: |
          git config user.name "Hedwig Bot"
          git config user.email "hedwig-bot@users.noreply.github.com"
          git add reports/ data/
          git diff --staged --quiet || git commit -m "Hedwig: report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
