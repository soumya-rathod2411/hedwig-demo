name: Hedwig Collect

# Runs 3x/day, spaced ~7 hours apart. Times are in UTC (GitHub Actions
# only understands UTC) -- these correspond to roughly 6am, 1pm, 8pm IST.
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST
    - cron: "30 7 * * *"   # 07:30 UTC = 13:00 IST
    - cron: "30 14 * * *"  # 14:30 UTC = 20:00 IST
  workflow_dispatch:  # lets you (or the app) trigger this manually too

# Least-privilege: this job only ever needs to write repo contents (to
# commit collected data) -- explicitly declaring that means the token
# can't do anything else, regardless of what the repo's org-wide or
# repo-level default token permissions happen to be set to.
permissions:
  contents: write

# Prevents two collection runs from overlapping if one runs long --
# the equivalent of the single-instance lock the local scheduler had.
concurrency:
  group: hedwig-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung step (network issue, infinite retry loop,
    # etc.) can't silently run for hours burning Actions minutes.
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Pinned exact versions -- API keys are exposed as env vars in
        # this same job, so an unpinned install could silently pull in
        # a newer, compromised release of a dependency (or a
        # typosquatted one) right before those secrets are used.
        # Bump these deliberately when you want to upgrade, not
        # automatically on every run.
        run: pip install requests==2.32.3

      - name: Run the collector
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python hedwig_collector.py

      - name: Commit and push updated data
        run: |
          git config user.name "Hedwig Bot"
          git config user.email "hedwig-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Hedwig: data collection $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
